<!DOCTYPE html> 
<html>
<head>
<title>Student Registration Form</title>
</head>
<body> 
<h1>Student Registration Form</h1> 
<hr>
<form>
<h2>Personal Information</h2>
<label>Student Name:</label>
<input type="Student Name" placeholder="Enter your name" required>
<p>
</p>
<label>Email:</label> 
<input type="Email" placeholder="Enter your Email" required> 
<p> 
</p>
<label>Password:</label> 
<input type="Password" placeholder="Enter your Password" required>
<p>
</p>
<label>Phone Number:</label> 
<input type="Number" placeholder="Enter your Phone Number" required>
<p>
</p>
<label>Date of Birth:</label> 
<input type="Date" placeholder="Enter your Date of Birth" required>
<p>
</p> 
<h2>Gender</h2>
<label>Gender:</label>
<input type="Radio" name="Gender" required>
<label for="Male">Male</label>
<input type="Radio" name="Gender" required>
<label for="Female">Female</label>
<input type="Radio" name="Gender" required>
<label for="Other">Other</label>
<p>
</p>
<h2>Course Selection</h2> 
<label>Course Selection:<label>
<select>
<option name="option1">Manual Testing</option>
<option name="option2">SQL</option>
<option name="option3">Selenium</option>
<option name="option4">Java</option>
<option name="option5">Python</option>
<option name="option5">Playwright</option>
</select>
<p>
</p> 
<h2>Skills</h2> 
<Label>Skills:</label>
<input type="checkbox"> HTML
<input type="checkbox"> SQL
<input type="checkbox"> Java
<input type="checkbox"> Python
<input type="checkbox"> Testing
<p>
</p>
<h2>Address</h2>
<labl>Address:</label> 
<input type="textarea" placeholder="Enter your Address" required>
<p>
</p>
<input type="file" name="filename">
<p>
</p>
<button input type="Submit">Submit Form</button>
<p>
</p>
<button input type="Reset">Clear Form</button>
</form>
</body>
</html>
